name: Setup
description: Install Node and the project's dependencies.

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    # `setup-node`'s cache only covers ~/.npm, npm's tarball cache -- `npm ci`
    # still spends ~20s unpacking those tarballs into node_modules on every job.
    # Cache the installed tree itself so a hit skips the install outright.
    # Exact match only, no restore-keys: a partial hit would leave the tree
    # disagreeing with the lockfile.
    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
