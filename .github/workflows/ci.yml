name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      # checkout stays in each job: a local composite action is read from the
      # workspace, so it cannot run until the repo is on disk.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  bundle:
    name: Bundle Current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # A JS action runs the committed bundle, so a dist/ that lags behind src/
      # ships the old behaviour while the diff shows the new one. Rebuild and
      # fail if anything moved.
      - name: Verify dist/ is current
        run: |
          pnpm build
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is out of date -- run 'pnpm build' and commit the result."
            exit 1
          fi

  self-test:
    name: Self-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repo's own pull requests are the action's first consumer: it counts
      # this diff and posts the comment, so a change is exercised before release.
      - uses: ./
        id: lines

      # Same check as the read-only job: the comment is posted by the action
      # itself, so the outputs are what tells us this path produced real counts
      # rather than an empty tally it rendered anyway.
      - name: Check the counts came back
        env:
          JSON: ${{ steps.lines.outputs.json }}
        run: |
          echo "$JSON" | jq -e '.byCategory.source.added.code >= 0' > /dev/null
          echo "$JSON" | jq -e '.total.added.code >= 0' > /dev/null
          echo "$JSON" | jq -c '.total'

  self-test-read-only:
    name: Self-test (no comment)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # Deliberately without `pull-requests: write`. This is the path a consumer
    # takes to get the numbers without granting the action write access, so the
    # job would rather fail here than let that path rot.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: lines
        with:
          comment: false

      # The outputs and the job summary are all this path produces, so an
      # empty or malformed `json` is the failure worth catching.
      - name: Check the counts came back
        env:
          JSON: ${{ steps.lines.outputs.json }}
        run: |
          echo "$JSON" | jq -e '.byCategory.source.added.code >= 0' > /dev/null
          echo "$JSON" | jq -e '.total.added.code >= 0' > /dev/null
          echo "$JSON" | jq -c '.total'
