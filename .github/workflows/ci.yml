name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run ts:check
      - run: npm run test:unit

      # A JS action runs the committed bundle, so a dist/ that lags behind src/
      # ships the old behaviour while the diff shows the new one. Rebuild and
      # fail if anything moved.
      - name: Verify dist/ is current
        run: |
          npm run build
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is out of date -- run 'npm run build' and commit the result."
            exit 1
          fi
