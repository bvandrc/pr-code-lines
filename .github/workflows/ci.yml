name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      # checkout stays in each job: a local composite action is read from the
      # workspace, so it cannot run until the repo is on disk.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  bundle:
    name: Bundle Current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # A JS action runs the committed bundle, so a dist/ that lags behind src/
      # ships the old behaviour while the diff shows the new one. Rebuild and
      # fail if anything moved.
      - name: Verify dist/ is current
        run: |
          pnpm build
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is out of date -- run 'pnpm build' and commit the result."
            exit 1
          fi

  self-test:
    name: Self-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # `contents: read` is all the action needs to count and render. Nothing
    # here writes to the pull request, so the job would rather fail than let
    # that stay true only by accident.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dogfood: the action counts its own pull request.
      - uses: ./
        id: lines
        with:
          title: PR code lines (self-test)

      # The outputs and the job summary are all this produces, so an empty or
      # malformed `json` is the failure worth catching.
      - name: Check the counts came back
        env:
          JSON: ${{ steps.lines.outputs.json }}
        run: |
          echo "$JSON" | jq -e '.byCategory.source.added.code >= 0' > /dev/null
          echo "$JSON" | jq -e '.total.added.code >= 0' > /dev/null
          echo "$JSON" | jq -c '.total'
