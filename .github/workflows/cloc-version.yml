name: cloc Version

on:
  schedule:
    - cron: '0 10 * * 1' # Mondays, 10:00 UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # pushes the branch the pull request is opened from
  pull-requests: write

jobs:
  check:
    name: Check the cloc version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Rewrites src/cloc/version.json when upstream has moved on, version and
      # checksum together -- one without the other fails the checksum at runtime.
      - name: Compare the pinned version against upstream
        id: cloc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm cloc:check

      # version.json is compiled into the bundle, so skipping this would open a pull
      # request that fails its own Bundle Current job.
      - name: Rebuild the bundle
        if: steps.cloc.outputs.outdated == 'true'
        run: pnpm build

      - name: Open a pull request
        if: steps.cloc.outputs.outdated == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cloc.outputs.version }}
          PREVIOUS: ${{ steps.cloc.outputs.previous }}
        run: |
          branch="chore/cloc-$VERSION"

          # A second Monday on the same release would otherwise fail the push.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists -- nothing to open."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "fix: move cloc to v$VERSION"
          git push -u origin "$branch"

          gh pr create \
            --title "fix: move cloc to v$VERSION" \
            --body "cloc released v$VERSION; we were on v$PREVIOUS.

          \`src/cloc/version.json\` was rewritten whole -- version and checksum together, the checksum taken from the release asset itself -- and \`dist/\` rebuilt so the bundle carries the same release.

          Nothing here is trusted on faith: the Unit Tests job runs the real script against throwaway git repositories, so a release that changed how cloc counts turns this pull request red rather than quietly changing everyone's numbers. Read those results before merging."
