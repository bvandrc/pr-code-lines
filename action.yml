name: PR Code Lines
description: Count the code lines a pull request changes, with comments, blank lines, tests, generated files, docs, and config tallied separately.
author: bvandrc

branding:
  icon: bar-chart-2
  color: purple

inputs:
  github-token:
    description: "Token used to post the comment. Needs `pull-requests: write`."
    default: ${{ github.token }}
  comment:
    description: Post the table as a sticky pull request comment.
    default: 'true'
  title:
    description: Heading shown at the top of the comment and the job summary.
    default: PR code lines
  base-sha:
    description: Revision to count from. Defaults to the pull request's base; the merge base of the two is what actually gets counted.
    default: ''
  head-sha:
    description: Revision to count to. Defaults to the pull request's head.
    default: ''

outputs:
  markdown:
    description: The rendered table, for posting somewhere else.
  json:
    description: Every count, as `{byCategory,total}` -- see the README.

runs:
  using: node24
  main: dist/index.cjs
